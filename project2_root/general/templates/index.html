{% extends "base.html" %}

{% block content %}
<h1>Our site name</h1>
<form action="{% url 'search_results' %}" method="get">
    <input type="text" name="q" placeholder="Search series...">
    <button type="submit">Search</button>
  </form>

<h2>Sample Quizzes:</h2>
{% for topic in topics %}
    <div>
        <h2>{{ topic.name }}</h2>
        <p>Questions: {{ topic.questions_count }}</p>
        <form method="post" action="{% url 'get-questions-start' %}">
            {% csrf_token %}
            <input type="hidden" name="quiz_id" value="{{ topic.id }}">
            <button type="submit">Start Quiz</button>
        </form>
    </div>
{% endfor %}
{% endblock content %}
