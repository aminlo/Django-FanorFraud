{% extends 'base.html' %}

{% block content %}
<h2>Answer</h2>
<p>Your answer: {{ submitted_answer.text }}</p>
<p>Correct answer: {{ answer.text }}</p>

<form method="post" action="{% url 'get-questions' %}">
    {% csrf_token %}
    <input type="hidden" name="quiz_id" value="{{ submitted_answer.question.quiz.id }}">
    <button type="submit">Next Question</button>
</form>
{% endblock %}
