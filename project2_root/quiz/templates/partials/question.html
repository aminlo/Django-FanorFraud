{% extends 'base.html' %}

{% block content %}
<h2>Question</h2>
<p>{{ question.text }}</p>

<form method="post" action="{% url 'get-answer' %}">
    {% csrf_token %}
    <input type="hidden" name="quiz_id" value="{{ question.quiz.id }}">
    {% for answer in answers %}
        <div>
            <input type="radio" name="answer_id" value="{{ answer.id }}" required>
            <label>{{ answer.text }}</label>
        </div>
    {% endfor %}
    <button type="submit">Submit Answer</button>
</form>
{% endblock %}
