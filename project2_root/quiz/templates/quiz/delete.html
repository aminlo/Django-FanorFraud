{% extends 'quiz_index/base.html' %}

{% block content %}
<h2>Delete Quiz</h2>
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ quiz.name }}"?</p>
    <input type="submit" value="Confirm" />
</form>
<a href="{% url 'quiz-manage' %}"><button>Back to Quizzes</button></a>
{% endblock %}
