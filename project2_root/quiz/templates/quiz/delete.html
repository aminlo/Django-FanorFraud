{% extends 'base.html' %}

{% block content %}
<div class="signup-page">
    <div class="signup-container">
        <h2 class="signup-title">Delete Quiz</h2>
        <form method="post" class="signup-form">
            {% csrf_token %}
            <p class="form-group">Are you sure you want to delete "{{ quiz.name }}"?</p>
            <div class="button-container">
                <input type="submit" value="Confirm" class="signup-button" />
            </div>
        </form>
        <div class="button-container">
            <a href="{% url 'profile' %}" class="signup-button">Back to Profile</a>
        </div>
    </div>
</div>
{% endblock %}
