{% extends 'base.html' %}

{% block content %}
<div class="signup-page">
    <div class="signup-container">
        <h2 class="signup-title">Update Question</h2>
        <form method="post" class="signup-form">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>

            <h3 class="signup-subtitle">Answers:</h3>
            <div class="form-group">
                {{ answer_formset.management_form }}
                {% for form in answer_formset %}
                <div class="answer-form">
                    <div class="form-group">
                        <label>Answer Text:</label>
                        {{ form.text }}
                    </div>
                    <div class="form-group">
                        <label>
                            {{ form.is_correct }} Mark as correct answer
                        </label>
                    </div>
                    {{ form.id }}
                </div>
                {% endfor %}
            </div>

            <div class="button-container">
                <button type="submit" class="signup-button">Submit</button>
            </div>
        </form>
        <div class="button-container">
            <a href="{% url 'quiz-detail' question.quiz.id %}" class="signup-button">Back to Quiz</a>
        </div>
    </div>
</div>
{% endblock %}
