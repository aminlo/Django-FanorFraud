{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="{% url 'quiz-manage' %}" class="list-group-item list-group-item-action">Manage Quizzes</a>
                <a href="{% url 'quiz-create' %}" class="list-group-item list-group-item-action">Create New Quiz</a>
                <a href="{% url 'start' %}" class="list-group-item list-group-item-action">Back to Quiz</a>
            </div>
        </div>
        <div class="col-md-9">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            {% block manage_content %}
            {% endblock %}
        </div>
    </div>
</div>
{% endblock %}
