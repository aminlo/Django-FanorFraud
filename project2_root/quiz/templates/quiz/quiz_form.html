{% extends 'quiz/base_manage.html' %}

{% block manage_content %}
<div class="card">
    <div class="card-header">
        <h2>{% if form.instance.pk %}Edit Quiz{% else %}Create New Quiz{% endif %}</h2>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Quiz Name</label>
                {{ form.name }}
                {% if form.name.errors %}
                    <div class="alert alert-danger">
                        {{ form.name.errors }}
                    </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'quiz-manage' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
