{% extends 'quiz_index/base.html' %}

{% block content %}
<h2>Create Question</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    
    <h3>Answers:</h3>
    {{ answer_formset.management_form }}
    {% for form in answer_formset %}
        <div class="answer-form">
            {{ form.as_p }}
        </div>
    {% endfor %}
    
    <input type="submit" value="Submit" />
</form>
<a href="{% url 'quiz-detail' quiz_id %}"><button>Back to Quiz</button></a>
{% endblock %}
