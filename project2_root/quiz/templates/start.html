{% extends 'quiz_index/base.html' %}

{% block content %}
<h1>Quiz Topics</h1>

{% for topic in topics %}
    <div>
        <h2>{{ topic.name }}</h2>
        <p>Questions: {{ topic.questions_count }}</p>
        <form method="post" action="{% url 'get-questions-start' %}">
            {% csrf_token %}
            <input type="hidden" name="quiz_id" value="{{ topic.id }}">
            <button type="submit">Start Quiz</button>
        </form>
    </div>
{% endfor %}

<a href="{% url 'quiz-manage' %}"><button>Manage Quizzes</button></a>
{% endblock %}
